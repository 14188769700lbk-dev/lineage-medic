name: Judging assets health

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/judging-health.yml
      - scripts/check-public-assets.mjs
      - package.json
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judging-assets-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run health:public
